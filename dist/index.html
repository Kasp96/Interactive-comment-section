<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Interactive comments section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="/css/base/styles-min.css">
</head>

<body>

    <div class="app">
        <div class="container-xl">
            <div class="comments-section mx-2">
                <div class="comment-card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <img class="user-avatar" src="../images/image-amyrobson.png" alt="user image">
                        <h2 class="comment-author">amyrobson</h2>
                        <h3 class="posting-date">1 month ago</h3>
                    </div>
                    <p class="comment-text my-3">Impressive! Though it seems the drag feature could be improved. But overall
                        it looks incredible. You've nailed the design and the responsiveness at various breakpoints
                        works really well.</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <button class="voting-btn justify-content-center d-flex align-items-center">
                            <img src="../images/icon-plus.svg" alt="">
                            <span class="voting-counter">12</span>
                            <img src="../images/icon-minus.svg" alt="">
                        </button>
                        <button class="reply-btn d-flex align-items-center gap-2">
                            <img src="../images/icon-reply.svg" alt="">
                            Reply
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
<script type="module" src="/js/script-min.js"></script>
</body>

</html>
